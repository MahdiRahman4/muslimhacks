name = "muslimhacks-api"
main = "src/index.ts"
compatibility_date = "2025-02-04"

[vars]
CORS_ORIGIN = "http://localhost:8080"
JWT_SECRET = "local-dev-jwt-secret-change-before-production"
EMAIL_FROM = "info@muslimhacks.ca"

# Cloudflare Email Sending (beta). Needs muslimhacks.ca onboarded + Active zone.
# remote = true so local wrangler dev can send real emails.
[[send_email]]
name = "EMAIL"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "muslimhacks-registration"
database_id = "3b79a39c-2e2f-42eb-a75b-d7f2d11b4c55"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "muslimhacks-resumes"
preview_bucket_name = "muslimhacks-resumes-preview"
